# Macross v0.6.5 のコンテナイメージを作り、ghcr.io に公開する（Kubernetes・OSS Showcase で使う）
#   ghcr.io/aketi-maika/macross-server:0.6.5   Rust サーバ + Vue 画面
#   ghcr.io/aketi-maika/macross-janus:0.6.5    Janus（AudioBridge）
#   ghcr.io/aketi-maika/macross-config:0.6.5   Macross.yaml から設定を生成する initContainer
name: v0.6.5 images

on:
  push:
    branches: [v0.6.5]
    paths:
      - "v0.6.5/**"
      - ".github/workflows/v0.6.5-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v0.6.5/server
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - run: cargo test --locked || cargo test

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: server
            context: v0.6.5
            file: v0.6.5/Dockerfile
          - name: janus
            context: v0.6.5/janus
            file: v0.6.5/janus/Dockerfile
          - name: config
            context: v0.6.5
            file: v0.6.5/config/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/aketi-maika/macross-${{ matrix.name }}:0.6.5
            ghcr.io/aketi-maika/macross-${{ matrix.name }}:0.6.5-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Macross v0.6.5 ${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
