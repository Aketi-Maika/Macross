# Macross α
#   起動:           docker compose up -d --build
#   HTTPS も起動:   MACROSS_DOMAIN=macross.build-maika.jp docker compose --profile tls up -d --build
#
# WebRTC の UDP ポート範囲を扱うため、全サービスを host ネットワークで動かす。

services:
  janus:
    build: ./janus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Macross.yaml:/etc/macross/Macross.yaml:ro
      - /srv/macross/work:/srv/macross/work

  server:
    build: .
    network_mode: host
    restart: unless-stopped
    depends_on:
      - janus
    volumes:
      - ./Macross.yaml:/etc/macross/Macross.yaml:ro
      - /srv/macross/recordings:/srv/macross/recordings
      - /srv/macross/work:/srv/macross/work
      - /srv/macross/data:/srv/macross/data

  # 録音の閲覧・ダウンロード（https://<ドメイン>/files/）
  # 認証は Caddy が Macross のログイン（admin）で行うため、File Browser 自体は noauth
  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    network_mode: host
    restart: unless-stopped
    command:
      - --noauth
      - --address=127.0.0.1
      - --port=8090
      - --baseurl=/files
      - --root=/srv
      - --database=/database/filebrowser.db
    volumes:
      - /srv/macross/recordings:/srv:ro
      - filebrowser_db:/database

  # ---- 監視（Grafana: https://<ドメイン>/grafana/、admin のみ） ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave

  prometheus:
    image: prom/prometheus:v2.54.1
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    network_mode: host
    restart: unless-stopped
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_DOMAIN=${MACROSS_DOMAIN:-macross.build-maika.jp}
      - GF_SERVER_ROOT_URL=https://${MACROSS_DOMAIN:-macross.build-maika.jp}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # 認証は Caddy が Macross の admin ログインで行う
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/macross.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  caddy:
    image: caddy:2.8.4
    profiles: ["tls"]
    network_mode: host
    restart: unless-stopped
    environment:
      - MACROSS_DOMAIN=${MACROSS_DOMAIN:-macross.build-maika.jp}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
  filebrowser_db:
  prometheus_data:
  grafana_data:
