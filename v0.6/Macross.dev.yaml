# ローカル開発用（Windows 等で server/ から cargo run する場合）
# 例: cd server && cargo run -- --config ../Macross.dev.yaml

server:
  listen: "127.0.0.1:8080"
  web_dir: "../web/dist"
  data_dir: "../dev-data"
  cookie_secure: false

limits:
  max_connections: 100

channels:
  room_base: 1001
  initial:
    - name: "ch1"
    - name: "ch2"

recording:
  dir: "../dev-data/recordings"
  retention_days: 90

janus:
  url: "http://127.0.0.1:8088/janus"
